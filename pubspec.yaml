name: mealconnect
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & State Management
  get: ^4.6.6  # Latest stable (supports Flutter 3.19)
  get_cli: ^1.8.1  # For code generation
  
  # UI Components & Widgets
  pin_code_fields: ^8.2.0  # Updated for Flutter 3.19 compatibility
  pinput: ^5.1.0  # Latest with null safety fixes
  roundcheckbox: ^2.0.5  # Latest stable
  sizer: ^3.0.4  # Latest - responsive design
  flutter_advanced_switch: ^3.2.0  # Updated with new features
  table_calendar: ^3.1.3  # Latest with bug fixes
  intl_phone_field: ^3.3.1  # Updated with country code fixes
  
  # Firebase Core (Must be first)
  firebase_core: ^3.10.1  # Latest - required for all Firebase services
  
  # Firebase Services
  firebase_auth: ^5.4.1  # Latest with enhanced security
  cloud_firestore: ^5.6.2  # Latest with query optimizations
  firebase_storage: ^12.4.3  # Latest for file uploads
  
  # Device & Platform
  image_picker: ^1.1.3  # Updated with permission handling
  shared_preferences: ^2.0.11  # Latest - local storage
  uuid: ^4.5.1  # Latest for unique IDs
  
  # App Configuration
  change_app_package_name: ^1.5.0  # Android package rename
  rename_app: ^1.6.2  # App name change

  # Icons
  cupertino_icons: ^1.0.8  # Latest iOS icons

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:    
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/logos/
  
  fonts:
    - family: Metropolis
      fonts:
        - asset: assets/fonts/Metropolis-Regular.otf
          weight: 400
        - asset: assets/fonts/Metropolis-Medium.otf
          weight: 500
        - asset: assets/fonts/Metropolis-Bold.otf
          weight: 700
        - asset: assets/fonts/Metropolis-ExtraBold.otf
          weight: 800
        - asset: assets/fonts/Metropolis-Light.otf
          weight: 300
        - asset: assets/fonts/Metropolis-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Metropolis-Thin.otf
          weight: 100
        - asset: assets/fonts/Metropolis-RegularItalic.otf
          weight: 400
          style: italic


    - family: Altoys
      fonts:
        - asset: assets/fonts/altoysitalic.otf
          style: italic


    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700    
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300        


    - family: Europa
      fonts:
        - asset: assets/fonts/Europa-Bold.ttf
          weight: 700
        - asset: assets/fonts/Europa-Light.ttf
          weight: 300
         

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100